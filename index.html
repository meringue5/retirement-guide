<!doctype html>
<html lang="ko">
<head>

<header class="topbar" id="topbar">

    <span class="loc-no" id="locNo"></span>

  </button>
  <div class="mode" role="group" aria-label="보기 방식">
    <button data-mode="read" aria-pressed="false">정독</button>
    <button data-mode="point" aria-pressed="true">요점</button>
  </div>
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>

<div class="frame">
  <nav class="nav" id="nav" aria-label="목차"></nav>

    <button class="sheet-close" id="sheetClose" aria-label="닫기">닫기</button>

  <div class="sheet-body" id="sheetBody"></div>
